name: Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: false
        default: 'Build'
        type: choice
        options:
          - Build
          - Rebuild
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    runs-on: [AS6-runner]

    permissions:
      contents: read

    env:
      PROJECT: example/AsProject/AsProject.apj

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Find AS6 build executable
        uses: loupeteam/br-actions/find-as6-build@f6f1ec537a8e621889a19279a4886aaf46d8a2ea # v1.0.5
        id: find-as

      - name: Build Intel
        uses: loupeteam/br-actions/build-as-project@f6f1ec537a8e621889a19279a4886aaf46d8a2ea # v1.0.5
        with:
          exe-path:   ${{ steps.find-as.outputs.exe-path }}
          project:    ${{ env.PROJECT }}
          config:     Intel
          build-mode: ${{ inputs.build_mode || 'Build' }}

      - name: Build ARM
        uses: loupeteam/br-actions/build-as-project@f6f1ec537a8e621889a19279a4886aaf46d8a2ea # v1.0.5
        with:
          exe-path:   ${{ steps.find-as.outputs.exe-path }}
          project:    ${{ env.PROJECT }}
          config:     ARM
          build-mode: ${{ inputs.build_mode || 'Build' }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BuildDiagnostics
          path: example/AsProject/Temp/BuildDiagnostics.log
          if-no-files-found: ignore
